name: Roadmap quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  react-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build interactive planner
        run: npm run build

  latex-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install XeLaTeX, Font Awesome, and Noto fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-xetex \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            fonts-noto-core \
            poppler-utils
      - name: Compile 33-page printable planner
        working-directory: roadmap
        run: |
          xelatex -interaction=nonstopmode -halt-on-error roadmap.tex
          xelatex -interaction=nonstopmode -halt-on-error roadmap.tex
      - name: Verify PDF page count
        working-directory: roadmap
        run: |
          test "$(pdfinfo roadmap.pdf | awk '/^Pages:/ {print $2}')" = "33"
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: tun-sopheak-roadmap-planner-pdf
          path: roadmap/roadmap.pdf
          if-no-files-found: error

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [react-build, latex-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure deployment identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Deploy interactive planner to gh-pages
        run: npm run deploy
