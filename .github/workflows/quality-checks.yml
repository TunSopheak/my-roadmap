name: Roadmap quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  react-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build React roadmap
        run: npm run build

  latex-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install XeLaTeX and Khmer font
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-latex-extra texlive-fonts-recommended fonts-noto-core
      - name: Compile printable roadmap
        working-directory: roadmap
        run: |
          xelatex -interaction=nonstopmode -halt-on-error roadmap.tex
          xelatex -interaction=nonstopmode -halt-on-error roadmap.tex
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: tun-sopheak-roadmap-pdf
          path: roadmap/roadmap.pdf
          if-no-files-found: error
